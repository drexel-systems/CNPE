---
# Redis is the backing store — the DynamoDB equivalent in this stack.
# Single-node, no persistence configured: demo purposes only.
# Production would use a StatefulSet with a PersistentVolumeClaim.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: orders
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: orders
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
