---
# Traefik Ingress — Traefik ships with k3s, no extra install needed.
#
# No host restriction — routes on path alone so the API is reachable by:
#   • IP directly:       http://<VM_IP>/orders
#   • Hostname (optional): http://orders.local/orders  (add VM_IP to /etc/hosts)
#   • Host-header curl:  curl -H "Host: orders.local" http://<VM_IP>/orders
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-api-ingress
  namespace: orders
  annotations:
    # Tell Traefik this is an HTTP (not HTTPS) ingress
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: order-api
                port:
                  number: 80
